# This workflow builds and publishes Netshoot Docker images to GHCR and Docker Hub.
#
# Triggers:
# - Push to 'main' branch: publishes floating tags (latest, docker, podman, etc.)
# - Push of tags 'v*.*.*': publishes SemVer tags per variant (e.g. 1.2.3-docker)
# - Pull Requests: build-only (no push) to validate that the Docker build succeeds.
#   Only runs if PR author is trusted or PR is approved by an org OWNER/MEMBER.
#
# Build order:
# 1. gatekeeper     — PR security check (runs once, not per variant)
# 2. build-base     — base + slim images (independent, parallel)
# 3. build-variants — docker/podman/nerdctl/containerd (parallel, after base)
#
# Cache strategy:
# Each variant uses a scoped GHA cache (scope=buildkit-<variant>). Variant
# builds also read from scope=buildkit-base to reuse the shared base layers,
# avoiding redundant rebuilds of the base stage.

name: Build and Publish Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ---------------------------------------------------------------------------
# Gatekeeper: PR security check (runs once for the whole workflow)
# ---------------------------------------------------------------------------
jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
      push_images: ${{ steps.check.outputs.push_images }}
      push_dockerhub: ${{ steps.check.outputs.push_dockerhub }}
      sign_images: ${{ steps.check.outputs.sign_images }}
      has_dockerhub_secrets: ${{ steps.secrets.outputs.has_dockerhub_secrets }}
    steps:
      - name: Security gatekeeper
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "Event is push, proceeding with build/push/sign."
            echo "run_build=true"       >> "$GITHUB_OUTPUT"
            echo "push_images=true"     >> "$GITHUB_OUTPUT"
            echo "push_dockerhub=true"  >> "$GITHUB_OUTPUT"
            echo "sign_images=true"     >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pull request: build-only (no push, no sign)
          echo "PR #${PR_NUMBER} by ${PR_AUTHOR}"

          # Check if author is trusted
          trusted_authors=("obeone")
          trusted="false"
          for author in "${trusted_authors[@]}"; do
            [[ "$author" == "$PR_AUTHOR" ]] && trusted="true" && break
          done

          # Check if PR is approved by an org owner/member
          approved="false"
          approvals=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.state=="APPROVED" and (.author_association=="OWNER" or .author_association=="MEMBER")) | .user.login' || true)
          [[ -n "${approvals}" ]] && approved="true"

          if [[ "$trusted" == "true" || "$approved" == "true" ]]; then
            echo "PR meets security criteria, proceeding with build-only (no push)."
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "PR does not meet security criteria, skipping build."
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

          echo "push_images=false"     >> "$GITHUB_OUTPUT"
          echo "push_dockerhub=false"  >> "$GITHUB_OUTPUT"
          echo "sign_images=false"     >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub credentials availability
        id: secrets
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "has_dockerhub_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub credentials not configured, skipping Docker Hub push."
            echo "has_dockerhub_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Build base images (base + slim) — these have no upstream dependencies
  # ---------------------------------------------------------------------------
  build-base:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: base
            dockerfile: Dockerfile
            target: base
            floating_tags: latest,debian,debian-latest
            semver_suffix: ''
          - variant: slim
            dockerfile: Dockerfile.slim
            target: base
            floating_tags: slim,slim-latest
            semver_suffix: -slim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.gatekeeper.outputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.gatekeeper.outputs.push_dockerhub == 'true' && needs.gatekeeper.outputs.has_dockerhub_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        if: needs.gatekeeper.outputs.push_images == 'true'
        id: tags
        uses: ./.github/actions/compute-tags
        with:
          variant: ${{ matrix.variant }}
          floating_tags: ${{ matrix.floating_tags }}
          semver_suffix: ${{ matrix.semver_suffix }}
          push_dockerhub: ${{ needs.gatekeeper.outputs.push_dockerhub == 'true' && needs.gatekeeper.outputs.has_dockerhub_secrets == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ needs.gatekeeper.outputs.push_images == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags || '' }}
          cache-from: type=gha,scope=buildkit-${{ matrix.variant }}
          cache-to: ${{ needs.gatekeeper.outputs.push_images == 'true' && format('type=gha,scope=buildkit-{0},mode=max', matrix.variant) || '' }}

      - name: Set up cosign
        if: needs.gatekeeper.outputs.sign_images == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        if: needs.gatekeeper.outputs.sign_images == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE_IMAGES: ${{ steps.tags.outputs.base_images }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${DIGEST}" ]] && echo "Empty digest" >&2 && exit 1
          while IFS= read -r image; do
            [[ -z "$image" ]] && continue
            echo "Signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"
          done <<< "$BASE_IMAGES"

  # ---------------------------------------------------------------------------
  # Build variant images (docker, podman, nerdctl, containerd)
  # These all extend FROM base, so they run after build-base to reuse its
  # cached layers via cache-from with the buildkit-base scope.
  # ---------------------------------------------------------------------------
  build-variants:
    needs: [gatekeeper, build-base]
    if: needs.gatekeeper.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: docker
            target: docker
            floating_tags: docker,debian-docker
            semver_suffix: -docker
          - variant: podman
            target: podman
            floating_tags: podman,debian-podman
            semver_suffix: -podman
          - variant: nerdctl
            target: nerdctl
            floating_tags: nerdctl,debian-nerdctl
            semver_suffix: -nerdctl
          - variant: containerd
            target: containerd
            floating_tags: containerd,debian-containerd
            semver_suffix: -containerd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.gatekeeper.outputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.gatekeeper.outputs.push_dockerhub == 'true' && needs.gatekeeper.outputs.has_dockerhub_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        if: needs.gatekeeper.outputs.push_images == 'true'
        id: tags
        uses: ./.github/actions/compute-tags
        with:
          variant: ${{ matrix.variant }}
          floating_tags: ${{ matrix.floating_tags }}
          semver_suffix: ${{ matrix.semver_suffix }}
          push_dockerhub: ${{ needs.gatekeeper.outputs.push_dockerhub == 'true' && needs.gatekeeper.outputs.has_dockerhub_secrets == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: ${{ needs.gatekeeper.outputs.push_images == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags || '' }}
          cache-from: |
            type=gha,scope=buildkit-base
            type=gha,scope=buildkit-${{ matrix.variant }}
          cache-to: ${{ needs.gatekeeper.outputs.push_images == 'true' && format('type=gha,scope=buildkit-{0},mode=max', matrix.variant) || '' }}

      - name: Set up cosign
        if: needs.gatekeeper.outputs.sign_images == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        if: needs.gatekeeper.outputs.sign_images == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE_IMAGES: ${{ steps.tags.outputs.base_images }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${DIGEST}" ]] && echo "Empty digest" >&2 && exit 1
          while IFS= read -r image; do
            [[ -z "$image" ]] && continue
            echo "Signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"
          done <<< "$BASE_IMAGES"
