# This workflow builds and publishes Netshoot Docker images to GHCR and Docker Hub.
#
# Triggers:
# - Push to 'main' branch: publishes floating tags (latest, docker, podman, etc.)
# - Push of tags 'v*.*.*': publishes SemVer tags per variant (e.g. 1.2.3-docker)
# - Manual dispatch (workflow_dispatch): same behaviour as a push (build + push
#   + sign). Restricted by GitHub to users with write access to the repo.
# - Weekly schedule (Monday 04:17 UTC): same behaviour as a push to main
#   (floating tags + sign), so the images pick up Debian security updates even
#   when nothing is merged. GitHub runs schedules on the default branch only.
# - Pull Requests: build-only (no push) to validate that the Docker build succeeds.
#   Only runs if PR author is trusted or PR is approved by an org OWNER/MEMBER.
#
# Build order:
# 1. gatekeeper     — PR security check and shared build values (runs once)
# 2. build-base     — base + slim images (independent, parallel)
# 3. build-variants — docker/podman/nerdctl/containerd (parallel, after base)
#
# Each matrix job first builds a linux/amd64 image into the runner's Docker
# engine and runs tests/smoke.sh against it (on PRs too). Only if that passes
# does the multi-arch build run; it reuses the amd64 layers already in the
# builder, then pushes, attests (provenance + SBOM) and signs when allowed.
#
# Cache strategy:
# Each variant uses a scoped GHA cache (scope=buildkit-<variant>). Variant
# builds also read from scope=buildkit-base to reuse the shared base layers,
# avoiding redundant rebuilds of the base stage. Every build of a run passes
# the same CACHE_BUST build arg (the ISO week, computed once by the
# gatekeeper), so the weekly refresh invalidates the apt upgrade layer once a
# week and the variants still hit the base cache within a run.
#
# Every build also gets the optional github_token secret, used by the install
# scripts for GitHub API calls. The scripts fall back to the unauthenticated
# releases/latest redirect when it is empty.

name: Build and Publish Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ---------------------------------------------------------------------------
# Gatekeeper: PR security check (runs once for the whole workflow)
# ---------------------------------------------------------------------------
jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run_build: ${{ steps.check.outputs.run_build }}
      push_images: ${{ steps.check.outputs.push_images }}
      push_dockerhub: ${{ steps.check.outputs.push_dockerhub }}
      sign_images: ${{ steps.check.outputs.sign_images }}
      has_dockerhub_secrets: ${{ steps.secrets.outputs.has_dockerhub_secrets }}
      cache_bust: ${{ steps.cache_bust.outputs.cache_bust }}
    steps:
      - name: Security gatekeeper
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # emit <run_build> <push_and_sign>: writes the job outputs.
          emit() {
            {
              echo "run_build=$1"
              echo "push_images=$2"
              echo "push_dockerhub=$2"
              echo "sign_images=$2"
            } >> "$GITHUB_OUTPUT"
          }

          # A schedule also fires in forks that enabled Actions; they cannot
          # push to the upstream registries, so skip it there.
          if [[ "$EVENT_NAME" == "schedule" && "$REPO" != "obeone/netshoot" ]]; then
            echo "Scheduled run outside obeone/netshoot, skipping."
            emit false false
            exit 0
          fi

          # schedule behaves like a push to main (github.ref is the default branch).
          if [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            echo "Event is ${EVENT_NAME}, proceeding with build/push/sign."
            emit true true
            exit 0
          fi

          # Pull request: build-only (no push, no sign)
          echo "PR #${PR_NUMBER} by ${PR_AUTHOR}"

          # Check if author is trusted
          trusted_authors=("obeone")
          trusted="false"
          for author in "${trusted_authors[@]}"; do
            [[ "$author" == "$PR_AUTHOR" ]] && trusted="true" && break
          done

          # Check if PR is approved by an org owner/member
          approved="false"
          approvals=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" \
            --jq '.[] | select(.state=="APPROVED" and (.author_association=="OWNER" or .author_association=="MEMBER")) | .user.login' || true)
          [[ -n "${approvals}" ]] && approved="true"

          if [[ "$trusted" == "true" || "$approved" == "true" ]]; then
            echo "PR meets security criteria, proceeding with build-only (no push)."
            emit true false
          else
            echo "PR does not meet security criteria, skipping build."
            emit false false
          fi

      - name: Check Docker Hub credentials availability
        id: secrets
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo "has_dockerhub_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docker Hub credentials not configured, skipping Docker Hub push."
            echo "has_dockerhub_secrets=false" >> "$GITHUB_OUTPUT"
          fi

      # Computed once so that every build of the run shares the same value:
      # the ISO week (e.g. 2026-W39) changes the CACHE_BUST build arg once a
      # week, which reruns the apt full-upgrade layer and everything after it.
      - name: Compute cache bust
        id: cache_bust
        shell: bash
        run: |
          set -euo pipefail
          cache_bust="$(date -u +%G-W%V)"
          echo "CACHE_BUST=${cache_bust}"
          echo "cache_bust=${cache_bust}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build base images (base + slim) — these have no upstream dependencies
  # ---------------------------------------------------------------------------
  build-base:
    needs: gatekeeper
    if: needs.gatekeeper.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # title/description override the OCI labels and annotations set
          # by docker/metadata-action; keep them in line with the LABELs of
          # the matching Dockerfile stage.
          - variant: base
            dockerfile: Dockerfile
            target: base
            floating_tags: latest,debian,debian-latest
            semver_suffix: ''
            title: netshoot
            description: Network troubleshooting toolkit with Docker/Podman/nerdctl
          - variant: slim
            dockerfile: Dockerfile.slim
            target: base
            floating_tags: slim,slim-latest
            semver_suffix: -slim
            title: netshoot-slim
            description: Network troubleshooting toolkit with a reduced tool set

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.gatekeeper.outputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.gatekeeper.outputs.push_dockerhub == 'true' && needs.gatekeeper.outputs.has_dockerhub_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        if: needs.gatekeeper.outputs.push_images == 'true'
        id: tags
        uses: ./.github/actions/compute-tags
        with:
          variant: ${{ matrix.variant }}
          floating_tags: ${{ matrix.floating_tags }}
          semver_suffix: ${{ matrix.semver_suffix }}
          push_dockerhub: ${{ needs.gatekeeper.outputs.push_dockerhub == 'true' && needs.gatekeeper.outputs.has_dockerhub_secrets == 'true' }}

      - name: Docker metadata (labels and annotations)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/obeone/netshoot
          # Only used to derive org.opencontainers.image.version: the SemVer
          # without 'v' on v* tags, the branch name otherwise (pr-<n> on PRs).
          # Image tags come from compute-tags.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT

      # Smoke test gate: build linux/amd64 only, load it into the runner's
      # engine and test it before the multi-arch build. Same inputs as the
      # build below (minus cache-to), so that build reuses these layers.
      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: netshoot-smoke:${{ matrix.variant }}
          cache-from: type=gha,scope=buildkit-${{ matrix.variant }}
          build-args: |
            CACHE_BUST=${{ needs.gatekeeper.outputs.cache_bust }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash tests/smoke.sh "${VARIANT}" "netshoot-smoke:${VARIANT}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ needs.gatekeeper.outputs.push_images == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # Index-level annotations need an image index to attach to, so they
          # are only passed when the build is pushed.
          annotations: ${{ needs.gatekeeper.outputs.push_images == 'true' && steps.meta.outputs.annotations || '' }}
          # Supply chain attestations, only for pushed images.
          provenance: ${{ needs.gatekeeper.outputs.push_images == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.gatekeeper.outputs.push_images == 'true' }}
          build-args: |
            CACHE_BUST=${{ needs.gatekeeper.outputs.cache_bust }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=buildkit-${{ matrix.variant }}
          cache-to: type=gha,scope=buildkit-${{ matrix.variant }},mode=max

      - name: Set up cosign
        if: needs.gatekeeper.outputs.sign_images == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        if: needs.gatekeeper.outputs.sign_images == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE_IMAGES: ${{ steps.tags.outputs.base_images }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${DIGEST}" ]] && echo "Empty digest" >&2 && exit 1
          while IFS= read -r image; do
            [[ -z "$image" ]] && continue
            echo "Signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"
          done <<< "$BASE_IMAGES"

  # ---------------------------------------------------------------------------
  # Build variant images (docker, podman, nerdctl, containerd)
  # These all extend FROM base, so they run after build-base to reuse its
  # cached layers via cache-from with the buildkit-base scope.
  # ---------------------------------------------------------------------------
  build-variants:
    needs: [gatekeeper, build-base]
    if: needs.gatekeeper.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # title/description: see build-base.
          - variant: docker
            dockerfile: Dockerfile
            target: docker
            floating_tags: docker,debian-docker
            semver_suffix: -docker
            title: netshoot-docker
            description: Netshoot with Docker CLI, buildx and compose (mount the host Docker socket)
          - variant: podman
            dockerfile: Dockerfile
            target: podman
            floating_tags: podman,debian-podman
            semver_suffix: -podman
            title: netshoot-podman
            description: Netshoot with Podman
          - variant: nerdctl
            dockerfile: Dockerfile
            target: nerdctl
            floating_tags: nerdctl,debian-nerdctl
            semver_suffix: -nerdctl
            title: netshoot-nerdctl
            description: Netshoot with nerdctl (client only)
          - variant: containerd
            dockerfile: Dockerfile
            target: containerd
            floating_tags: containerd,debian-containerd
            semver_suffix: -containerd
            title: netshoot-containerd
            description: Netshoot with nerdctl full (containerd included)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: needs.gatekeeper.outputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.gatekeeper.outputs.push_dockerhub == 'true' && needs.gatekeeper.outputs.has_dockerhub_secrets == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute tags
        if: needs.gatekeeper.outputs.push_images == 'true'
        id: tags
        uses: ./.github/actions/compute-tags
        with:
          variant: ${{ matrix.variant }}
          floating_tags: ${{ matrix.floating_tags }}
          semver_suffix: ${{ matrix.semver_suffix }}
          push_dockerhub: ${{ needs.gatekeeper.outputs.push_dockerhub == 'true' && needs.gatekeeper.outputs.has_dockerhub_secrets == 'true' }}

      - name: Docker metadata (labels and annotations)
        id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/obeone/netshoot
          # Only used to derive org.opencontainers.image.version: the SemVer
          # without 'v' on v* tags, the branch name otherwise (pr-<n> on PRs).
          # Image tags come from compute-tags.
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=ref,event=pr
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT

      # Smoke test gate: build linux/amd64 only, load it into the runner's
      # engine and test it before the multi-arch build. Same inputs as the
      # build below (minus cache-to), so that build reuses these layers.
      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: netshoot-smoke:${{ matrix.variant }}
          cache-from: |
            type=gha,scope=buildkit-base
            type=gha,scope=buildkit-${{ matrix.variant }}
          build-args: |
            CACHE_BUST=${{ needs.gatekeeper.outputs.cache_bust }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash tests/smoke.sh "${VARIANT}" "netshoot-smoke:${VARIANT}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: ${{ needs.gatekeeper.outputs.push_images == 'true' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # Index-level annotations need an image index to attach to, so they
          # are only passed when the build is pushed.
          annotations: ${{ needs.gatekeeper.outputs.push_images == 'true' && steps.meta.outputs.annotations || '' }}
          # Supply chain attestations, only for pushed images.
          provenance: ${{ needs.gatekeeper.outputs.push_images == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.gatekeeper.outputs.push_images == 'true' }}
          build-args: |
            CACHE_BUST=${{ needs.gatekeeper.outputs.cache_bust }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: |
            type=gha,scope=buildkit-base
            type=gha,scope=buildkit-${{ matrix.variant }}
          cache-to: type=gha,scope=buildkit-${{ matrix.variant }},mode=max

      - name: Set up cosign
        if: needs.gatekeeper.outputs.sign_images == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign images
        if: needs.gatekeeper.outputs.sign_images == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE_IMAGES: ${{ steps.tags.outputs.base_images }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "${DIGEST}" ]] && echo "Empty digest" >&2 && exit 1
          while IFS= read -r image; do
            [[ -z "$image" ]] && continue
            echo "Signing ${image}@${DIGEST}"
            cosign sign --yes "${image}@${DIGEST}"
          done <<< "$BASE_IMAGES"
