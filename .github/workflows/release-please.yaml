# This workflow manages releases using release-please.
#
# On every push to main, release-please either creates or updates a
# "Release PR" that accumulates changelog entries and computes the next
# SemVer version from conventional commits. When the Release PR is
# merged, release-please creates a git tag (vX.Y.Z) and a GitHub
# Release.
#
# Note: the tag is pushed with the default GITHUB_TOKEN, and GitHub does
# not start new workflow runs for events created by that token. So the
# tag does NOT trigger build-and-publish on its own. Publish the SemVer
# image tags by dispatching that workflow on the tag:
#
#   gh workflow run build-and-publish.yaml --ref vX.Y.Z
#
# Wiring this automatically requires a PAT or GitHub App token in the
# release-please step below, which is a deliberate trade-off left open.

name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
