name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        # dependabot/fetch-metadata v3.1.0, pinned to commit SHA
        # https://github.com/dependabot/fetch-metadata/releases/tag/v3.1.0
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Docker image bumps (the pinned debian and uv FROM lines) are never
      # auto-merged: build-and-publish does not build Dependabot PRs (the
      # gatekeeper does not trust the bot), so the smoke test would not run
      # before the new image reaches the floating tags. A maintainer merges
      # them by hand: approve, re-run the build-and-publish run of the PR (the
      # approval lets the gatekeeper through), then merge once it is green.
      - name: Approve and enable auto-merge for patch/minor updates
        if: |
          steps.metadata.outputs.package-ecosystem != 'docker' && (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          )
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
